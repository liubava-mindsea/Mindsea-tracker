<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MindSea">
<meta name="theme-color" content="#f3f3f3">
<link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22MindSea%20English%20Tracker%22%2C%22short_name%22%3A%22MindSea%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f3f3f3%22%2C%22theme_color%22%3A%22%2313244f%22%2C%22orientation%22%3A%22portrait%22%7D">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%2313244f' rx='40'/%3E%3Ctext x='90' y='110' font-family='Georgia,serif' font-size='52' font-weight='bold' fill='%23897500' text-anchor='middle'%3EMS%3C/text%3E%3C/svg%3E">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindSea — English Habit Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #f3f3f3;
    --white:    #ffffff;
    --navy:     #13244f;
    --navy-card:#13244f;
    --gold:     #897500;
    --gold-lt:  #b8a000;
    --green:    #1e7d5a;
    --green2:   #25a073;
    --text-on-navy:  #f0ede4;
    --text-muted-navy: rgba(240,237,228,0.6);
    --text-dark: #1a1a2e;
    --text-muted-light: #7a7a8a;
    --border-navy: rgba(137,117,0,0.3);
    --border-light: #d8d5cf;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text-dark);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER (white) ── */
  .header {
    background: var(--white);
    border-bottom: 1px solid var(--border-light);
    text-align: center;
    padding: 28px 20px 22px;
    animation: fadeDown 0.6s ease;
  }

  .logo-img {
    height: 100px;
    width: auto;
    display: block;
    margin: 0 auto 6px;
  }

  .header-sub {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 2.5px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .header-date {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted-light);
  }

  /* ── WRAPPER ── */
  .wrapper {
    max-width: 860px;
    margin: 0 auto;
    padding: 24px 14px 80px;
  }

  /* ── DATE STRIP ── */
  .date-strip {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 22px;
    scrollbar-width: none;
    animation: fadeUp 0.4s ease 0.05s both;
  }
  .date-strip::-webkit-scrollbar { display: none; }

  .date-tab {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 9px 13px;
    border-radius: 10px;
    border: 1px solid var(--border-light);
    background: var(--white);
    cursor: pointer;
    transition: all 0.2s;
    min-width: 50px;
  }
  .date-tab:hover { border-color: var(--gold); }
  .date-tab.active { background: var(--navy); border-color: var(--navy); }

  .date-tab .day-name {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted-light);
  }
  .date-tab.active .day-name { color: var(--text-muted-navy); }

  .date-tab .day-num {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-dark);
  }
  .date-tab.active .day-num { color: var(--white); }

  .date-tab .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--green2);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .date-tab.has-done .dot { opacity: 1; background: var(--gold); }

  /* ── STREAK ROW ── */
  .streak-row {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
    margin-bottom: 18px;
    animation: fadeUp 0.4s ease 0.1s both;
  }

  .streak-card {
    background: var(--navy);
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
  }

  .streak-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 600;
    line-height: 1;
    margin-bottom: 5px;
    color: var(--text-on-navy);
  }
  .streak-num.fire { color: #e8941a; }
  .streak-num.gold { color: #c8aa00; }

  .streak-label {
    font-size: 10px;
    color: var(--text-muted-navy);
  }

  /* ── PROGRESS CARD ── */
  .progress-overview {
    background: var(--navy);
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 22px;
    animation: fadeUp 0.4s ease 0.15s both;
  }

  .progress-overview-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .progress-overview-top h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    font-weight: 500;
    color: var(--text-on-navy);
  }

  .score-badge {
    font-family: 'DM Mono', monospace;
    font-size: 24px;
    color: #c8aa00;
  }

  .main-bar-track {
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 100px;
    overflow: hidden;
    margin-bottom: 14px;
  }

  .main-bar-fill {
    height: 100%;
    border-radius: 100px;
    background: linear-gradient(90deg, #897500, #c8aa00);
    transition: width 0.9s cubic-bezier(0.34,1.56,0.64,1);
    position: relative;
    overflow: hidden;
  }

  .main-bar-fill::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    animation: shimmer 2.5s infinite;
  }

  .stats-row { display:flex; gap:22px; flex-wrap:wrap; }
  .stat-val { font-family:'DM Mono',monospace; font-size:15px; color:var(--text-on-navy); }
  .stat-label { font-size:10px; color:var(--text-muted-navy); margin-top:2px; }

  /* ── SECTION ── */
  .section { margin-bottom:16px; animation: fadeUp 0.4s ease both; }

  .section-title {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 2.5px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 7px;
    padding-left: 2px;
  }

  /* ── HABIT CARD ── */
  .habit-card {
    background: var(--navy);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 6px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .habit-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    opacity: 0.8;
  }

  .habit-card.done { background: rgba(137,117,0,0.15); border-color: rgba(137,117,0,0.5); color: var(--navy); }
  .habit-card.done::before { background: var(--gold) !important; opacity: 1; }

  .habit-card.type-core::before    { background: #a0b8d8; }
  .habit-card.type-vocab::before   { background: #c8aa00; }
  .habit-card.type-extra::before   { background: #7a9fc0; }
  .habit-card.type-speak::before   { background: #c4883a; }
  .habit-card.type-grammar::before { background: #b0c8e0; }

  .habit-card:hover { transform: translateY(-1px); opacity: 0.95; }

  .habit-top {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 9px;
  }

  .habit-icon {
    width: 34px; height: 34px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
    background: rgba(255,255,255,0.07);
  }

  .habit-info { flex:1; min-width:0; }

  .habit-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-on-navy);
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .habit-meta { font-size: 11px; color: var(--text-muted-navy); }
  .habit-card.done .habit-name { color: var(--navy); }
  .habit-card.done .habit-meta { color: rgba(19,36,79,0.6); }

  .habit-actions { display:flex; align-items:center; gap:7px; flex-shrink:0; }

  .reminder-btn {
    width: 28px; height: 28px;
    border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.15);
    background: transparent;
    color: var(--text-muted-navy);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    transition: all 0.2s;
  }
  .reminder-btn:hover { border-color: #c8aa00; color: #c8aa00; }
  .reminder-btn.active { border-color: #c8aa00; color: #c8aa00; background: rgba(200,170,0,0.12); }

  .check-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
    color: transparent;
  }
  .check-btn:hover { border-color: var(--green2); transform: scale(1.1); }
  .habit-card.done .check-btn {
    background: var(--gold);
    border-color: var(--gold);
    color: white;
    transform: scale(1.05);
  }

  .habit-bar-track { height:3px; background:rgba(255,255,255,0.1); border-radius:100px; overflow:hidden; }
  .habit-bar-fill { height:100%; border-radius:100px; transition: width 0.7s cubic-bezier(0.34,1.56,0.64,1); }

  .type-core    .habit-bar-fill { background: #a0b8d8; }
  .type-vocab   .habit-bar-fill { background: #c8aa00; }
  .type-extra   .habit-bar-fill { background: #7a9fc0; }
  .type-speak   .habit-bar-fill { background: #c4883a; }
  .type-grammar .habit-bar-fill { background: #b0c8e0; }
  .habit-card.done .habit-bar-fill { background: var(--gold) !important; }

  .week-grid { display:flex; gap:5px; margin:5px 0 7px; }
  .week-dot { flex:1; height:3px; border-radius:100px; background:rgba(255,255,255,0.1); transition:background 0.3s; }
  .week-dot.filled { background: var(--gold); }
  .weekly-note { font-size:10px; color:var(--text-muted-navy); font-family:'DM Mono',monospace; margin-bottom:5px; }

  /* ── REMINDER MODAL ── */
  .reminder-popup {
    display: none;
    position: fixed; inset: 0;
    background: rgba(19,36,79,0.7);
    z-index: 100;
    align-items: center; justify-content: center;
    padding: 16px;
    backdrop-filter: blur(6px);
  }
  .reminder-popup.open { display: flex; }

  .reminder-modal {
    background: var(--white);
    border: 1px solid var(--border-light);
    border-radius: 16px;
    padding: 26px;
    width: 100%; max-width: 320px;
    animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  .reminder-modal h3 { font-family:'Cormorant Garamond',serif; font-size:20px; font-weight:600; color:var(--navy); margin-bottom:4px; }
  .reminder-modal p  { font-size:12px; color:var(--text-muted-light); margin-bottom:16px; }

  .time-input {
    width: 100%;
    padding: 11px;
    border-radius: 9px;
    border: 1px solid var(--border-light);
    background: var(--bg);
    color: var(--navy);
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    text-align: center;
    outline: none;
    margin-bottom: 14px;
    transition: border-color 0.2s;
  }
  .time-input:focus { border-color: var(--gold); }

  .modal-btns { display:flex; gap:9px; }
  .btn { flex:1; padding:11px; border-radius:9px; border:none; font-size:13px; font-weight:500; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all 0.2s; }
  .btn-cancel { background:var(--bg); color:var(--text-muted-light); border:1px solid var(--border-light); }
  .btn-save   { background:var(--navy); color:var(--white); font-weight:600; }
  .btn-save:hover { background:#1a3060; transform:translateY(-1px); }

  /* ── FOOTER ── */
  .footer {
    background: var(--white);
    border-top: 1px solid var(--border-light);
    margin-top: 40px;
    padding: 24px 16px;
    text-align: center;
  }

  .footer-links { display:flex; justify-content:center; gap:16px; flex-wrap:wrap; margin-bottom:14px; }

  .footer-link {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 18px;
    border-radius: 100px;
    background: var(--navy);
    color: var(--text-on-navy);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
    border: 1px solid transparent;
  }
  .footer-link:hover { background: #1a3060; transform: translateY(-1px); }
  .footer-link .link-icon { font-size: 16px; }

  .footer-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 1px;
  }

  /* ── FX ── */
  .burst { position:fixed; pointer-events:none; z-index:200; }
  .burst-dot { position:absolute; width:7px; height:7px; border-radius:50%; animation:burstAnim 0.7s ease forwards; }

  .toast {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: var(--navy);
    color: var(--text-on-navy);
    border: 1px solid rgba(137,117,0,0.5);
    padding: 18px 24px;
    border-radius: 18px;
    font-size: 15px;
    font-weight: 500;
    z-index: 400;
    opacity: 0;
    pointer-events: none;
    transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
    white-space: pre-line;
    text-align: center;
    max-width: 280px;
    line-height: 1.5;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .toast.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  
  /* Sound toggle button */
  .sound-toggle {
    position: fixed;
    top: 16px; right: 16px;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border-light);
    background: var(--white);
    color: var(--text-muted-light);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    z-index: 50;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .sound-toggle:hover { border-color: var(--gold); }
  .sound-toggle.muted { opacity: 0.5; }

  @keyframes fadeDown { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeUp   { from{opacity:0;transform:translateY(12px)}  to{opacity:1;transform:translateY(0)} }
  @keyframes popIn    { from{opacity:0;transform:scale(0.93)}       to{opacity:1;transform:scale(1)} }
  @keyframes shimmer  { from{transform:translateX(-100%)} to{transform:translateX(200%)} }
  @keyframes burstAnim{ 0%{opacity:1;transform:translate(0,0)scale(1)} 100%{opacity:0;transform:translate(var(--tx),var(--ty))scale(0)} }

  @media(max-width:480px){
    .streak-num{font-size:24px}
    .logo-img{height:80px}
  }

  /* ── REFLECTION BLOCK ── */
  .reflection-wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 14px 32px;
  }

  .reflection-block {
    background: var(--navy);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 10px;
  }

  .reflection-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .reflection-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--text-on-navy);
  }

  .reflection-date-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-muted-navy);
    letter-spacing: 1px;
  }

  .reflection-question {
    margin-bottom: 14px;
  }

  .reflection-question label {
    display: block;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #c8aa00;
    margin-bottom: 6px;
  }

  .reflection-question textarea {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 11px 13px;
    color: var(--text-on-navy);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    resize: none;
    outline: none;
    transition: border-color 0.2s;
    min-height: 72px;
  }

  .reflection-question textarea::placeholder {
    color: rgba(240,237,228,0.3);
    font-style: italic;
    font-size: 13px;
  }

  .reflection-question textarea:focus {
    border-color: rgba(200,170,0,0.5);
    background: rgba(255,255,255,0.08);
  }

  .reflection-words {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 6px;
  }

  .word-tag {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(200,170,0,0.15);
    border: 1px solid rgba(200,170,0,0.3);
    border-radius: 100px;
    padding: 4px 10px 4px 12px;
    font-size: 13px;
    color: var(--text-on-navy);
    animation: popIn 0.2s ease;
  }

  .word-tag button {
    background: none;
    border: none;
    color: rgba(240,237,228,0.4);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0;
    transition: color 0.15s;
  }
  .word-tag button:hover { color: #ef4444; }

  .word-input-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  .word-input {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--text-on-navy);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .word-input::placeholder { color: rgba(240,237,228,0.3); font-style: italic; font-size: 13px; }
  .word-input:focus { border-color: rgba(200,170,0,0.5); }

  .word-add-btn {
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid rgba(200,170,0,0.4);
    background: rgba(200,170,0,0.12);
    color: #c8aa00;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s;
    line-height: 1;
  }
  .word-add-btn:hover { background: rgba(200,170,0,0.22); }

  .reflection-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  .btn-save-reflection {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--gold);
    color: #0e1c3a;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-save-reflection:hover { background: #a08c00; transform: translateY(-1px); }

  .btn-copy-refl {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(200,170,0,0.4);
    background: rgba(200,170,0,0.12);
    color: #c8aa00;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-copy-refl:hover { background: rgba(200,170,0,0.22); transform: translateY(-1px); }

  .btn-share-tg {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(41,182,246,0.4);
    background: rgba(41,182,246,0.1);
    color: #7dd3fc;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .btn-share-tg:hover { background: rgba(41,182,246,0.18); transform: translateY(-1px); }

  .reflection-saved-note {
    text-align: center;

  {id:'exchange',  name:'Мовний обмін',               meta:'Tandem / HelloTalk / Speaky',        icon:'💬', type:'speak',   minutes:15},

const SECTIONS=[
  {key:'core',    label:'Основа'},
  {key:'vocab',   label:'Словниковий запас'},
  {key:'grammar', label:'Граматика'},
  {key:'speak',   label:'Говоріння та письмо'},
  {key:'extra',   label:'Додаткове занурення'}
];

let state=JSON.parse(localStorage.getItem('ms_tracker_v4')||'{}');
let selectedDate=todayKey(), reminderTarget=null;
function todayKey(){
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+d;
}
function getDay(k){if(!state[k])state[k]={done:{},reminders:{}};return state[k];}
function save(){localStorage.setItem('ms_tracker_v4',JSON.stringify(state));}

function buildDateStrip(){
  const strip=document.getElementById('dateStrip');strip.innerHTML='';
  const days=['нд','пн','вт','ср','чт','пт','сб'];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const key=d.toISOString().slice(0,10);
    const tab=document.createElement('div');
    tab.className='date-tab'+(key===selectedDate?' active':'');
    if(state[key]&&Object.values(state[key].done||{}).some(v=>v))tab.classList.add('has-done');
    tab.innerHTML=`<span class="day-name">${days[d.getDay()]}</span><span class="day-num">${d.getDate()}</span><span class="dot"></span>`;
    tab.onclick=()=>{selectedDate=key;buildDateStrip();buildHabits();updateProgress();};
    strip.appendChild(tab);
  }
}

function buildHabits(){
  const container=document.getElementById('habitsContainer');container.innerHTML='';
  const day=getDay(selectedDate);let delay=0.05;
  SECTIONS.forEach(sec=>{
    const habits=HABITS.filter(h=>h.type===sec.key);if(!habits.length)return;
    delay+=0.05;
    const secDiv=document.createElement('div');secDiv.className='section';secDiv.style.animationDelay=delay+'s';
    const t=document.createElement('div');t.className='section-title';t.textContent=sec.label;secDiv.appendChild(t);
    habits.forEach(h=>secDiv.appendChild(buildCard(h,day)));
    container.appendChild(secDiv);
  });
}

function buildCard(habit,day){
  const isDone=!!day.done[habit.id];
  const card=document.createElement('div');
  card.className=`habit-card type-${habit.type}${isDone?' done':''}`;
  card.id='card_'+habit.id;
  let weeklyHtml='';
  if(habit.weekly){
    const wd=getWeeklyDots(habit.id);
    weeklyHtml=`<div class="week-grid">${Array(7).fill(0).map((_,i)=>`<div class="week-dot${i<wd?' filled':''}"></div>`).join('')}</div><div class="weekly-note">${wd}/${habit.weeklyTarget} цього тижня</div>`;
  }
  card.innerHTML=`
    <div class="habit-top">
      <div class="habit-icon">${habit.icon}</div>
      <div class="habit-info">
        <div class="habit-name">${habit.name}</div>
        <div class="habit-meta">${habit.meta}</div>
      </div>
      <div class="habit-actions">
        <button class="check-btn" onclick="toggleHabit('${habit.id}')">✓</button>
      </div>
    </div>
    ${weeklyHtml}
    <div class="habit-bar-track"><div class="habit-bar-fill" id="bar_${habit.id}" style="width:${isDone?100:0}%"></div></div>`;
  return card;
}

function getWeeklyDots(id){
  let c=0;const today=new Date();const dow=today.getDay();
  const mon=new Date(today);mon.setDate(today.getDate()-(dow===0?6:dow-1));
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const k=d.toISOString().slice(0,10);if(state[k]&&state[k].done&&state[k].done[id])c++;}
  return c;
}

const TOAST_FIRST = [
  '💪 Перший крок зроблено!\nТак тримати!',
  '✨ Чудовий початок!\nТи вже в русі!',
  '🎯 Є! Починаємо день\nз маленької перемоги!',

];
const TOAST_SECOND = [

  '💫 Два кроки зроблено!\nОстанній — і можна пишатись!'
];
const TOAST_THIRD = [
  '🎉 УРА! Ціль дня досягнута!\nПовертайся завтра 🌊',

];

function getRandom(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

function toggleHabit(id){
  const day=getDay(selectedDate);day.done[id]=!day.done[id];save();
  const card=document.getElementById('card_'+id);const bar=document.getElementById('bar_'+id);
  if(day.done[id]){
    card.classList.add('done');bar.style.width='100%';spawnBurst(card);
    const doneCount = HABITS.filter(h=>day.done[h.id]).length;
    if(doneCount===1) { playSound('check'); showToast(getRandom(TOAST_FIRST), 3500); }
    else if(doneCount===2) { playSound('check'); showToast(getRandom(TOAST_SECOND), 4000); }
    else if(doneCount===3) { playSound('goal'); showToast(getRandom(TOAST_THIRD), 5000); triggerCelebration(); }
    else if(doneCount>3) { playSound('goal'); showToast(getRandom(TOAST_BONUS), 4500); spawnBurst(card); }
    else { playSound('check'); showToast('✓ Виконано!'); }
  } else{card.classList.remove('done');bar.style.width='0%';}
  updateProgress();buildDateStrip();
}

const DAILY_GOAL = 3;

function updateProgress(){
  const day=getDay(selectedDate);
  const done=HABITS.filter(h=>day.done[h.id]).length;
  const pct=Math.min(Math.round(done/DAILY_GOAL*100),100);
  document.getElementById('mainBar').style.width=pct+'%';
  document.getElementById('mainScore').textContent=Math.min(done,DAILY_GOAL)+'/'+DAILY_GOAL;
  document.getElementById('doneCount').textContent=done;
  document.getElementById('leftCount').textContent=Math.max(DAILY_GOAL-done,0);
  document.getElementById('todayScore').textContent=pct+'%';
  document.getElementById('streakNum').textContent=calcStreak();
  document.getElementById('weekScore').textContent=calcWeekPoints();
}

function dateKey(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const dd = String(date.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+dd;
}

function calcStreak(){
  let s=0; const d=new Date();
  while(true){
    const k = dateKey(d);
    const day = state[k];
    const doneCnt = day ? Object.values(day.done||{}).filter(Boolean).length : 0;
    // Skip today if nothing done yet — don't break streak
    if(doneCnt < 1) {
      if(s===0 && k===todayKey()) { d.setDate(d.getDate()-1); continue; }
      break;
    }
    s++; d.setDate(d.getDate()-1);
    if(s>365) break;
  }
  return s;
}
function calcWeekPoints(){
  let pts=0;const today=new Date();
  for(let i=0;i<7;i++){const d=new Date(today);d.setDate(today.getDate()-i);const day=state[d.toISOString().slice(0,10)];if(day)pts+=Object.values(day.done||{}).filter(Boolean).length;}
  return pts;
}





function spawnBurst(el){
  const r=el.getBoundingClientRect();
  const colors=['#897500','#c8aa00','#1e7d5a','#13244f','#c4883a'];
  const burst=document.createElement('div');burst.className='burst';
  burst.style.left=(r.left+r.width/2)+'px';burst.style.top=(r.top+r.height/2)+'px';
  for(let i=0;i<12;i++){
    const dot=document.createElement('div');dot.className='burst-dot';
    const angle=(i/12)*Math.PI*2;const dist=36+Math.random()*36;
    dot.style.setProperty('--tx',Math.cos(angle)*dist+'px');
    dot.style.setProperty('--ty',Math.sin(angle)*dist+'px');
    dot.style.background=colors[i%colors.length];
    burst.appendChild(dot);}
  document.body.appendChild(burst);setTimeout(()=>burst.remove(),900);
}

let toastTimer;
let soundEnabled = localStorage.getItem('ms_sound') !== 'off';

function updateSoundBtn(){
  const btn = document.getElementById('soundToggle');
  if(btn) btn.textContent = soundEnabled ? '🔊' : '🔇';
  if(btn) btn.classList.toggle('muted', !soundEnabled);
}

function toggleSound(){
  soundEnabled = !soundEnabled;
  localStorage.setItem('ms_sound', soundEnabled ? 'on' : 'off');
  updateSoundBtn();
}

function playSound(type) {
  if (!soundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    
    if (type === 'check') {
      osc.frequency.setValueAtTime(523, ctx.currentTime); // C5
      osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1); // E5
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.3);
    } else if (type === 'goal') {
      // Fanfare for goal reached
      const notes = [523, 659, 784, 1047];
      notes.forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.25, ctx.currentTime + i*0.12);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.12 + 0.25);
        o.start(ctx.currentTime + i*0.12);
        o.stop(ctx.currentTime + i*0.12 + 0.25);
      });
    }
  } catch(e) {}
}

function showToast(msg, duration=3500){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'), duration);
}

function triggerCelebration(){
  // Big burst from center
  const colors=['#897500','#c8aa00','#1e7d5a','#13244f','#dbc8b9','#e8941a'];
  for(let j=0;j<3;j++){
    setTimeout(()=>{
      const burst=document.createElement('div');burst.className='burst';
      burst.style.left='50%';burst.style.top='40%';
      for(let i=0;i<16;i++){
        const dot=document.createElement('div');dot.className='burst-dot';
        const angle=(i/16)*Math.PI*2;const dist=60+Math.random()*80;
        dot.style.setProperty('--tx',Math.cos(angle)*dist+'px');
        dot.style.setProperty('--ty',Math.sin(angle)*dist+'px');
        dot.style.background=colors[i%colors.length];
        dot.style.width=dot.style.height=(6+Math.random()*8)+'px';
        burst.appendChild(dot);
      }
      document.body.appendChild(burst);setTimeout(()=>burst.remove(),900);
    }, j*300);
  }
}

const REFL_FIELDS = ['refl_good','refl_easy','refl_hard','refl_explore'];

function loadReflection() {

function saveReflection() {
  const day = getDay(selectedDate);

    day.reflection[id] = document.getElementById(id).value.trim();

function getWords() {
  return Array.from(document.querySelectorAll('.word-tag'))

function renderWordTags(words) {
  const container = document.getElementById('wordTags');
  container.innerHTML = '';
  words.forEach(w => addWordTag(w));
}

function addWordTag(word) {
  if (!word.trim()) return;
  const container = document.getElementById('wordTags');
  const tag = document.createElement('div');
  tag.className = 'word-tag';
  tag.dataset.word = word;
  tag.innerHTML = `<span>${word}</span><button onclick="this.parentElement.remove()" title="Видалити">×</button>`;
  container.appendChild(tag);
}

function addWord() {
  const input = document.getElementById('wordInput');
  const val = input.value.trim();
  if (!val) return;
  addWordTag(val);
  input.value = '';
  input.focus();
}

document.getElementById('wordInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); addWord(); }
});

function buildShareText() {
  const day = getDay(selectedDate);
  const r = day.reflection || {};
  const done = HABITS.filter(h => day.done[h.id]);
  const total = HABITS.length;
  const pct = Math.round(done.length / total * 100);

  const [sy,sm,sd] = selectedDate.split('-').map(Number);
  const months = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
  const dateStr = sd + ' ' + months[sm-1];

  let msg = '🌊 MindSea English — ' + dateStr + '\n';
  msg += '📊 Прогрес: ' + done.length + '/' + total + ' (' + pct + '%)\n';
  if (done.length > 0) {
    msg += '✅ ' + done.map(h => h.icon + ' ' + h.name).join(', ') + '\n';
  }
  msg += '\n';
  if (r.refl_good)    msg += '✨ Що вийшло: ' + r.refl_good + '\n';
  if (r.refl_easy)    msg += '💪 Легко давалось: ' + r.refl_easy + '\n';
  if (r.refl_hard)    msg += '🤔 Складно: ' + r.refl_hard + '\n';
  if (r.refl_explore) msg += '🔍 Хочу розібратись: ' + r.refl_explore + '\n';
  const words = getWords();
  if (words.length > 0) msg += '💡 Нові слова: ' + words.join(', ') + '\n';
  return msg;
}

function copyReflection() {
  saveReflection();
  const msg = buildShareText();
  
  // iOS-compatible copy
  function iosCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '0';
    ta.style.top = '0';
    ta.style.opacity = '0';
    ta.style.fontSize = '16px'; // prevents iOS zoom
    document.body.appendChild(ta);
    ta.focus();
    ta.setSelectionRange(0, ta.value.length);
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
  }

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(msg).then(() => {
      showToast('📋 Скопійовано! Вставте в чат');
    }).catch(() => {
      iosCopy(msg);
      showToast('📋 Скопійовано! Вставте в чат');
    });
  } else {
    iosCopy(msg);
    showToast('📋 Скопійовано! Вставте в чат');
  }
}

});

// Show install banner on mobile if not already installed
window.addEventListener('load', function() {
  const isIOS = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
  const isStandalone = window.navigator.standalone;
  const bannerShown = localStorage.getItem('ms_banner_shown');
  
  if (isIOS && !isStandalone && !bannerShown) {
    setTimeout(() => {
      const banner = document.getElementById('installBanner');
      banner.style.display = 'flex';
      localStorage.setItem('ms_banner_shown', '1');
    }, 3000);
  }
});
</script>
